name: Agent job

# The TeckGrowth admin assistant's own machine. Started by repository_dispatch (event type agent) with only a job id,
# a one time callback token and the callback link. The runner fetches the job and its keys from TeckGrowth with that
# token, masks them, and sends every result back to TeckGrowth. Nothing about the job is printed to these public logs.
on:
  repository_dispatch:
    types: [agent]

concurrency:
  group: agent-${{ github.event.client_payload.id }}
  cancel-in-progress: false

jobs:
  agent:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - name: Job token
        env:
          P_CB: ${{ github.event.client_payload.callback_token }}
          P_ID: ${{ github.event.client_payload.id }}
          P_URL: ${{ github.event.client_payload.callback_url }}
        run: |
          echo "::add-mask::$P_CB"
          echo "TG_CB=$P_CB" >> "$GITHUB_ENV"; echo "TG_ID=$P_ID" >> "$GITHUB_ENV"; echo "TG_URL=$P_URL" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: .github/workflows/agent.yml
      - name: Tools for a meeting
        # a meeting only needs the Chrome that is already on the runner and four Python packages, so it starts in seconds
        if: github.event.client_payload.kind == 'meet'
        run: pip install -q websockets playwright google-auth requests
      - name: Tools for a sign in
        # a virtual screen, a VNC server, noVNC for the phone and a one time Cloudflare tunnel
        if: github.event.client_payload.kind == 'login'
        run: |
          pip install -q playwright
          sudo apt-get install -y -qq xvfb x11vnc novnc websockify > /dev/null
          curl -sSL -o /tmp/cf.deb https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb && sudo dpkg -i /tmp/cf.deb > /dev/null
      - name: Tools for a task
        if: github.event.client_payload.kind != 'meet' && github.event.client_payload.kind != 'login'
        run: |
          npm install --no-audit --no-fund > /dev/null
          npx playwright install --with-deps chromium > /dev/null
          pip install -q websockets playwright google-auth requests yt-dlp
          sudo apt-get install -y -qq ffmpeg > /dev/null
      - name: Work
        run: node agent/run.mjs
